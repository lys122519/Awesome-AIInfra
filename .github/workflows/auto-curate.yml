name: Auto-curate tracker papers

on:
  workflow_dispatch:
  schedule:
    # Tracker runs on days 3 and 17 at 01:17 UTC. Sync one day later so its
    # snapshot, metadata enrichment, and push have time to finish.
    - cron: '17 1 4,18 * *'

permissions:
  contents: write

concurrency:
  group: auto-curate-tracker-papers
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Awesome-AIInfra
        uses: actions/checkout@v4
        with:
          path: awesome

      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          repository: lys122519/AIInfra-paper-update-tracker
          path: tracker
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: awesome/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r awesome/requirements.txt

      - name: Export tracker candidates
        run: python tracker/scripts/export_candidates.py --output "$RUNNER_TEMP/candidates.yaml"

      - name: Screen candidates
        run: >-
          python awesome/scripts/screen_candidates.py
          "$RUNNER_TEMP/candidates.yaml"
          --output "$RUNNER_TEMP/decisions.yaml"

      - name: Apply high-confidence accepts
        working-directory: awesome
        run: >-
          python scripts/apply_screening.py
          "$RUNNER_TEMP/decisions.yaml"
          --accept-only
          --review-method automated-ai-infra-title-policy-v1

      - name: Regenerate and validate the collection
        working-directory: awesome
        run: |
          python scripts/generate_readme.py
          python scripts/generate_readme.py --check
          python -m unittest discover -s tests -v

      - name: Commit automatic additions
        working-directory: awesome
        run: |
          if git diff --quiet -- data/papers.yaml README.md; then
            echo "No new high-confidence papers to collect."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.yaml README.md
          git commit -m "Automatically curate tracker papers $(date -u '+%Y-%m-%d')"
          git push origin HEAD:main
